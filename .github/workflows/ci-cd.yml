name: CI-CD Pipeline

on:
  push:
    branches:
      - develop

jobs:

  test-and-build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t modern-data-pipeline .

      - name: Run Pipeline Test
        run: docker run modern-data-pipeline

  deploy-to-dev:
    needs: test-and-build
    runs-on: ubuntu-24.04

    steps:

      - name: Deploy to EC2 DEV Server

        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            cd modern-data-pipeline

            git pull origin develop

            docker stop modern-data-pipeline-container || true

            docker rm modern-data-pipeline-container || true

            docker build -t modern-data-pipeline .

            docker run \
              --name modern-data-pipeline-container \
              -v $(pwd)/data:/app/data \
              modern-data-pipeline