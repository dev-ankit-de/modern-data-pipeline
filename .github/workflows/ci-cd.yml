name: CI Pipeline

on:
  push:
    branches:
      - develop

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t simple-data-pipeline .

      - name: Run Pipeline
        run: docker run simple-data-pipeline